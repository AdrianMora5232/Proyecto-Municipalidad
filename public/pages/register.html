<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - Municipalidad de Escazú</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="auth-page">
  <main class="auth-container">
    <form id="registerForm" class="form-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <img src="../img/logo.png" alt="Escudo" style="height: 70px; width: auto; margin-bottom: 1rem;" />
        <h1>Crear Cuenta</h1>
        <p style="color: var(--text-light)">Únase para mejorar su comunidad</p>
      </div>

      <label for="name">Nombre</label>
      <input id="name" type="text" placeholder="" required />

      <label for="email">Correo Electrónico</label>
      <input id="email" type="email" placeholder="" required />

      <label for="phone">Teléfono</label>
      <input id="phone" type="tel" placeholder="" required />

      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="" required />

      <label for="confirmPassword">Confirmar Contraseña</label>
      <input id="confirmPassword" type="password" placeholder="" required />

      <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Registrarse</button>

      <div style="text-align: center; margin-top: 1.5rem;">
        <span style="color: var(--text-light)">¿Ya tiene una cuenta?</span>
        <a href="/pages/login.html">Iniciar Sesión</a>
      </div>
    </form>
  </main>

  <footer>
    <div class="footer-bottom">
      &copy; 2026 Municipalidad de Escazú
    </div>
  </footer>

  <script type="module">
    import { auth } from '/js/auth.js';

    document.getElementById('registerForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const submitBtn = event.target.querySelector('button[type="submit"]');
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // 1. Validar que coincidan
      if (password !== confirmPassword) {
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: 'Las contraseñas son incorrectas', // User specific phrase for mismatch
          confirmButtonColor: 'var(--primary)'
        });
        return;
      }

      // 2. Validar requisitos de complejidad
      // Minimo 6 letras, una mayuscula y un numero
      const passwordRegex = /^(?=.*[A-Z])(?=.*\d).{6,}$/;
      if (!passwordRegex.test(password)) {
        Swal.fire({
          icon: 'error',
          title: 'Contraseña débil',
          text: 'La contraseña debe tener al menos 6 caracteres, una letra mayúscula y un número.',
          confirmButtonColor: 'var(--primary)'
        });
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Registrando...';

      const userData = {
        nombre: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phonenumber: document.getElementById('phone').value,
        password: password
      };

      try {
        await auth.register(userData);

        await Swal.fire({
          icon: 'success',
          title: '¡Registro Exitoso!',
          text: 'Por favor inicia sesión.',
          confirmButtonColor: 'var(--primary)'
        });

        window.location.href = '/pages/login.html';
      } catch (error) {
        Swal.fire({
          icon: 'error',
          title: 'Error en registro',
          text: error.message,
          confirmButtonColor: 'var(--primary)'
        });
        submitBtn.disabled = false;
        submitBtn.textContent = 'Registrarse';
      }
    });
  </script>
</body>

</html>
