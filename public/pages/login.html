<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Municipalidad de Escazú</title>
  <link rel="stylesheet" href="../css/styles/main.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="auth-page">
  <main class="auth-container">
    <form id="loginForm" class="form-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <img src="../img/logo.png" alt="Escudo" style="height: 70px; width: auto; margin-bottom: 1rem;" />
        <h1>Bienvenido</h1>
        <p style="color: var(--text-light)">Ingrese a su cuenta para continuar</p>
      </div>

      <label for="email">Correo Electrónico</label>
      <input id="email" type="email" placeholder="" required />

      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="" required />

      <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Entrar</button>

      <div style="text-align: center; margin-top: 1.5rem;">
        <span style="color: var(--text-light)">¿No tiene una cuenta?</span>
        <a href="register.html">Regístrese aquí</a>
      </div>

      <button type="button" class="btn secondary" onclick="window.location.href='index.html'"
        style="width: 100%; margin-top: 1rem;">Volver al Inicio</button>
    </form>
  </main>

  <footer>
    <div class="footer-bottom">
      &copy; 2026 Municipalidad de Escazú
    </div>
  </footer>

  <script type="module">
    import { auth } from "../js/auth.js";

    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();

      const submitBtn = event.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verificando...';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const user = await auth.login(email, password);

        // Se quita el "Verificando..." y se habilita el botón
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';

        await Swal.fire({
          icon: 'success',
          title: '¡Bienvenido!',
          text: 'Inicio de sesión exitoso',
          timer: 1500,
          showConfirmButton: false,
          timerProgressBar: true,
          confirmButtonColor: 'var(--primary)'
        });

        // Redirect based on role
        if (user.rol === 'Admin') {
          window.location.href = 'administrador.html';
        } else {
          window.location.href = '/pages/index.html';
        }
      } catch (error) {
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: error.message,
          confirmButtonColor: 'var(--primary)'
        });
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
      }
    });
  </script>
</body>

</html>
